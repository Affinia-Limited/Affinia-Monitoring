# Local development stack: docker compose up --build
#   Web UI:   http://localhost:8080   (proxies /api to the backend)
#   API docs: http://localhost:8000/api/docs
#
# Defaults run with dev authentication and the MOCK Azure provider (clearly labelled demo data),
# so no Azure subscription or Entra app registration is needed. See docker-compose.azure.yml
# to use real Azure and Entra ID. Settings can be overridden in a local, git-ignored .env file.

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AUTH_MODE: ${AUTH_MODE:-dev}
  AZURE_PROVIDER: ${AZURE_PROVIDER:-mock}
  TASK_BACKEND: celery
  # Local-only credentials for the throwaway development database. Never reuse elsewhere.
  DATABASE_URL: postgresql+asyncpg://monitoring:monitoring@postgres:5432/monitoring
  REDIS_URL: redis://redis:6379/0
  # List settings are comma-separated.
  CORS_ORIGINS: http://localhost:8080,http://localhost:5173

# Optional settings (Entra IDs, Key Vault URL, ...) come from a local .env file if present.
x-backend-env-file: &backend-env-file
  - path: .env
    required: false

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Local-only credentials (see note above).
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: monitoring
      POSTGRES_DB: monitoring
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: monitoring-backend:local
    env_file: *backend-env-file
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: worker.Dockerfile
    image: monitoring-worker:local
    env_file: *backend-env-file
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: monitoring-worker:local
    env_file: *backend-env-file
    environment: *backend-env
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      worker:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_AUTH_MODE: ${AUTH_MODE:-dev}
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:-}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:-}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:-}
        VITE_ENTRA_REDIRECT_URI: ${VITE_ENTRA_REDIRECT_URI:-http://localhost:8080}
    image: monitoring-frontend:local
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
