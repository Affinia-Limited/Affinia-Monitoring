# Full stack: PostgreSQL, Redis, API (runs migrations on start), Celery worker, Celery beat, web UI.
#
#   docker-compose up -d --build        (legacy docker-compose v1.27+)
#   docker compose up -d --build        (Compose v2 plugin)
#
#   Web UI:  http://<server>:${WEB_PORT:-8080}   (nginx serves the SPA and proxies /api to the backend)
#
# Only the web UI is published. PostgreSQL, Redis and the API are reachable only on the internal
# Compose network. Settings come from ./.env (copy .env.example); the values below override the
# ones in .env that must point at the other containers (database, Redis, task backend).
#
# Defaults run with dev authentication (NO sign-in: every visitor is a Super Admin) and the MOCK
# Azure provider. Before exposing this beyond a trusted network, set AUTH_MODE=entra and configure
# Entra ID (docs/entra-id.md, docs/user-access-management.md). See docker-compose.azure.yml for real Azure.

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AUTH_MODE: ${AUTH_MODE:-dev}
  AZURE_PROVIDER: ${AZURE_PROVIDER:-mock}
  TASK_BACKEND: celery
  # Points at the postgres service. Use a URL-safe password (letters, digits, - and _).
  DATABASE_URL: postgresql+asyncpg://monitoring:${POSTGRES_PASSWORD:-monitoring}@postgres:5432/monitoring
  REDIS_URL: redis://redis:6379/0
  # Proxies in front of the API: 1 = the frontend nginx only; 2 = a host reverse proxy / TLS terminator
  # (e.g. https://your-domain) in front of it. Needed for correct client IPs in audit logs and rate limits.
  TRUSTED_PROXY_COUNT: ${PROXY_HOPS:-1}
  # The browser talks to nginx on the same origin, so CORS is not needed; keep the list strict.
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitoring}
      POSTGRES_DB: monitoring
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitoring -d monitoring"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: monitoring-backend:local
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./backend
      dockerfile: worker.Dockerfile
    image: monitoring-worker:local
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    image: monitoring-worker:local
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=INFO", "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true
    depends_on:
      worker:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Public build-time values only (compiled into the browser bundle).
        VITE_API_BASE_URL: /api/v1
        VITE_AUTH_MODE: ${AUTH_MODE:-dev}
        VITE_ENTRA_CLIENT_ID: ${VITE_ENTRA_CLIENT_ID:-}
        VITE_ENTRA_TENANT_ID: ${VITE_ENTRA_TENANT_ID:-}
        VITE_ENTRA_API_SCOPE: ${VITE_ENTRA_API_SCOPE:-}
        VITE_ENTRA_REDIRECT_URI: ${VITE_ENTRA_REDIRECT_URI:-http://localhost:8080}
    image: monitoring-frontend:local
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: http://backend:8000
    ports:
      # Local only by default: with AUTH_MODE=dev every visitor is a Super Admin. Set WEB_BIND=0.0.0.0
      # only with AUTH_MODE=entra, or behind a host reverse proxy that authenticates.
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
