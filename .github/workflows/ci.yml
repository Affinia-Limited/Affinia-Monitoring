name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend - lint, type check, tests, migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Ephemeral CI database; not a real credential.
          POSTGRES_USER: monitoring
          POSTGRES_PASSWORD: monitoring
          POSTGRES_DB: monitoring
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoring -d monitoring"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ENVIRONMENT: test
      AUTH_MODE: dev
      AZURE_PROVIDER: mock
      TASK_BACKEND: inline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy app
      - name: Migrations (upgrade, drift check, downgrade) - before tests, which reset the schema
        env:
          DATABASE_URL: postgresql+asyncpg://monitoring:monitoring@localhost:5432/monitoring
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Unit and API tests (against PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://monitoring:monitoring@localhost:5432/monitoring
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend - lint, type check, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python tooling
        run: pip install -r backend/requirements-dev.txt
      - name: pip-audit (Python dependency vulnerabilities)
        run: pip-audit -r backend/requirements.txt
      - name: Bandit (Python static analysis)
        run: bandit -c backend/pyproject.toml -r backend/app -ll
      - name: npm audit (JavaScript dependency vulnerabilities)
        working-directory: frontend
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
      # The open-source CLI is used directly: gitleaks-action requires a licence key for organisation repos.
      - name: Gitleaks (secret scanning, full history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest             detect --source /repo --redact --no-banner --exit-code 1

  docker:
    name: Docker build and image scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: backend
            file: backend/Dockerfile
          - name: worker
            context: backend
            file: backend/worker.Dockerfile
          - name: frontend
            context: frontend
            file: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: monitoring-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: monitoring-${{ matrix.name }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
